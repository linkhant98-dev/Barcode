name: CI

on:
  push:
    branches: [CB-EMS-MVC, main]
  pull_request:
    branches: [CB-EMS-MVC, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EMS.sln

      - name: Build
        run: dotnet build EMS.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EMS.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
